# The production stack on one PC, at http://localhost:3000, with no domain or certificate needed. Everything
# else is exactly what a VM runs. Used by `.\infra\dev\stack.ps1 prod`; PUBLIC_URL comes from local.env.
services:
  caddy:
    ports: !override ["127.0.0.1:3000:3000"]
    # Any host name, so a tunnel (docs/deploy-vercel-render.md) is served too: it arrives as its own address, not
    # localhost, and ngrok's --host-header is deprecated. The port is bound to 127.0.0.1, so nothing else reaches it.
    environment: { PUBLIC_URL: ":3000" }
