# Render's half of the hosted system: API, workers, road router, database and Redis. The web app is on Netlify
# (netlify.toml). Steps and costs: docs/deploy-render-netlify.md. Secrets are generated by Render or typed into
# its prompts, so none belongs in this file. Everything sits in one region: private addresses stop at its edge.
envVarGroups:
  - name: reliefroute-shared
    envVars:
      - key: APP_ENV
        value: production
      # Typed once to create a duty officer, and used by the simulated fleet. Render makes it: read it on the group's page.
      - key: OPERATOR_TOKEN
        generateValue: true
      # Drivers type this once at sign-up.
      - key: ENROLMENT_CODE
        generateValue: true
      # See core/config.py: reliefroute-redis has no public address, because its allow list is empty.
      - key: REDIS_PRIVATE_NETWORK
        value: "true"
      # The start of every link in an email. Must match the Netlify site.
      - key: PUBLIC_URL
        value: https://reliefroute-ap.netlify.app
      - key: REGION_BBOX
        value: 76.6,12.5,84.9,20.1
      - key: REGION_NAME
        value: Andhra Pradesh
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: gemini
      - key: AUTO_APPROVE
        value: "true"
      - key: DRILL_SEND_MESSAGES
        value: "false"
      # Presentation mode. Without it there are no trucks until real drivers sign up. To go live for real, set
      # this to false and delete reliefroute-fleet: "Ending presentation mode" in docs/demo-script.md.
      - key: DEMO_FLEET
        value: "true"

services:
  - type: web
    name: reliefroute-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: integration/gate3
    dockerContext: .
    dockerfilePath: ./infra/deploy/backend.Dockerfile
    preDeployCommand: python -m app.core.migrate
    healthCheckPath: /health
    buildFilter:
      paths: [backend/app/**, backend/migrations/**, backend/requirements/**, contracts/**, infra/deploy/backend.Dockerfile]
    envVars:
      - fromGroup: reliefroute-shared
      - key: DATABASE_URL
        fromDatabase: { name: reliefroute-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: reliefroute-redis, property: connectionString }
      - key: VALHALLA_URL
        fromService: { type: pserv, name: reliefroute-valhalla, property: hostport }
      - key: PORT
        value: "8000"
      # Render's proxy is the only way in, and its address changes, so uvicorn can't be told which one to trust.
      # docs/security.md says what this costs.
      - key: FORWARDED_ALLOW_IPS
        value: "*"

  # Workers run the migrations too: they can start before the API, and the migration lock makes them take turns.
  - type: worker
    name: reliefroute-brain
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: integration/gate3
    dockerContext: .
    dockerfilePath: ./infra/deploy/backend.Dockerfile
    dockerCommand: sh -c "python -m app.core.migrate && exec python -m app.graph.worker"
    buildFilter:
      paths: [backend/app/**, backend/migrations/**, backend/requirements/**, contracts/**, infra/deploy/backend.Dockerfile]
    envVars:
      - fromGroup: reliefroute-shared
      - key: DATABASE_URL
        fromDatabase: { name: reliefroute-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: reliefroute-redis, property: connectionString }
      - key: VALHALLA_URL
        fromService: { type: pserv, name: reliefroute-valhalla, property: hostport }
      - key: DOCUMENTS_DIR
        value: /data/documents
      - key: GEMINI_API_KEY
        sync: false

  - type: worker
    name: reliefroute-ingestion
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: integration/gate3
    dockerContext: .
    dockerfilePath: ./infra/deploy/backend.Dockerfile
    dockerCommand: sh -c "python -m app.core.migrate && exec python -m app.ingestion.worker"
    buildFilter:
      paths: [backend/app/**, backend/migrations/**, backend/requirements/**, contracts/**, infra/deploy/backend.Dockerfile, infra/osm/data/**]
    envVars:
      - fromGroup: reliefroute-shared
      - key: DATABASE_URL
        fromDatabase: { name: reliefroute-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: reliefroute-redis, property: connectionString }
      - key: FACILITIES_EXTRACT_PATH
        value: /app/infra/osm/data/facilities.geojsonseq
      - key: PLACES_EXTRACT_PATH
        value: /app/infra/osm/data/places.geojsonseq
      - key: ADMIN_EXTRACT_PATH
        value: /app/infra/osm/data/admin.geojsonseq
      - key: FIRMS_MAP_KEY
        sync: false

  # Simulated drivers for presentations. It uses only the public API, like a real phone.
  - type: worker
    name: reliefroute-fleet
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: integration/gate3
    dockerContext: .
    dockerfilePath: ./infra/deploy/demo.Dockerfile
    buildFilter:
      paths: [backend/tests/tools/**, infra/deploy/demo.Dockerfile]
    envVars:
      - fromGroup: reliefroute-shared
      - key: API_URL
        fromService: { type: web, name: reliefroute-api, property: hostport }

  - type: pserv
    name: reliefroute-valhalla
    runtime: docker
    plan: 1c-2g
    region: singapore
    branch: integration/gate3
    dockerContext: .
    dockerfilePath: ./infra/deploy/valhalla.Dockerfile
    buildFilter:
      paths: [infra/deploy/valhalla.Dockerfile]

  # noeviction: streams hold undelivered events, so a full Redis must refuse writes rather than drop them.
  - type: keyvalue
    name: reliefroute-redis
    plan: 256mb
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: reliefroute-db
    plan: 0.5c-1g
    region: singapore
    postgresMajorVersion: "16"
    diskSizeGB: 5
    databaseName: reliefroute
    user: reliefroute
    ipAllowList: []
