# Local stack. Owner: Instance B (written at Gate 0 as the skeleton both sides develop against).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: reliefroute
      POSTGRES_PASSWORD: reliefroute
      POSTGRES_DB: reliefroute
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliefroute"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  valhalla:
    # Builds routing tiles from the OSM extract on first start (slow; tiles persist in the volume).
    image: ghcr.io/valhalla/valhalla-scripted:latest
    environment:
      tile_urls: ${VALHALLA_PBF_URL:?set VALHALLA_PBF_URL to a Geofabrik .osm.pbf for the demo region}
      serve_tiles: "True"
      build_admins: "True"
      build_time_zones: "True"
      use_tiles_ignore_pbf: "True"
    ports: ["8002:8002"]
    volumes: [valhalla:/custom_files]
    profiles: ["routing"]

volumes:
  pgdata:
  redisdata:
  valhalla:
