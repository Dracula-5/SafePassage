# Every push and pull request. Actions and images are pinned to exact commits and digests, so a moved
# tag cannot change what runs here. Tests that need the Valhalla road graph skip: it is too large to
# build in CI, so run the full suite locally before merging a planning change (see README).
name: CI

on:
  push:
    branches: [main, "integration/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: reliefroute
          POSTGRES_PASSWORD: reliefroute
          POSTGRES_DB: reliefroute
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U reliefroute" --health-interval 5s --health-retries 30
      redis:
        image: redis@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://reliefroute:reliefroute@127.0.0.1:5432/reliefroute
      TEST_REDIS_URL: redis://127.0.0.1:6379/9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install exact versions
        run: >
          pip install -c backend/requirements/constraints.txt -e contracts/python
          -r backend/requirements/brain.txt -r backend/requirements/senses.txt -r backend/requirements/dev.txt
      - name: No fake data in runtime code
        run: python contracts/tools/audit_runtime.py
      - name: Tests
        working-directory: backend
        run: python -m pytest -q --tb=short -rs
      - name: Known vulnerabilities in Python packages
        run: pipx run pip-audit -r backend/requirements/constraints.txt --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_REGION_BBOX: 76.6,12.5,84.9,20.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen # LayoutProps and friends are generated, and a fresh checkout has none
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: node --test tests/queue.test.mjs
      - run: npm run build
      - name: Known vulnerabilities in npm packages
        run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: reliefroute
          POSTGRES_PASSWORD: reliefroute
          POSTGRES_DB: reliefroute
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U reliefroute" --health-interval 5s --health-retries 30
      redis:
        image: redis@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://reliefroute:reliefroute@127.0.0.1:5432/reliefroute
      REDIS_URL: redis://127.0.0.1:6379/0
      REGION_BBOX: 76.6,12.5,84.9,20.1
      VALHALLA_URL: http://127.0.0.1:1
      OPERATOR_TOKEN: browser-test-operator-code-long-enough
      ENROLMENT_CODE: browser-test-code
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      MAIL_FROM: ReliefRoute <relief@example.org>
      PUBLIC_URL: http://localhost:3000
      API_ORIGIN: http://127.0.0.1:8000
      NEXT_PUBLIC_REGION_BBOX: 76.6,12.5,84.9,20.1
      E2E_MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API
        run: |
          pip install -c backend/requirements/constraints.txt -e contracts/python -r backend/requirements/brain.txt -r backend/requirements/senses.txt
          cd backend
          python -m app.core.migrate
          nohup python -m uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Start the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run start > web.log 2>&1 &
      - name: Browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs, if something failed
        if: failure()
        run: tail -n 40 backend/api.log frontend/web.log

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Production compose is valid when filled in
        run: |
          sed -E 's/^(POSTGRES_PASSWORD|APP_DB_PASSWORD|REDIS_PASSWORD)=.*/\1=check/; s|^PUBLIC_URL=.*|PUBLIC_URL=https://relief.example.org|' infra/deploy/.env.example > infra/deploy/.env
          docker compose -f infra/deploy/docker-compose.prod.yml --env-file infra/deploy/.env config -q
      - name: Production compose refuses to run with a secret missing
        run: |
          ! docker compose -f infra/deploy/docker-compose.prod.yml --env-file infra/deploy/.env.example config -q

      - name: Backend image builds
        run: docker build -f infra/deploy/backend.Dockerfile -t reliefroute-backend .
      - name: Web app image builds
        run: >
          docker build -f infra/deploy/frontend.Dockerfile -t reliefroute-frontend
          --build-arg NEXT_PUBLIC_REGION_BBOX=76.6,12.5,84.9,20.1 .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No secrets anywhere in history
        run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner
