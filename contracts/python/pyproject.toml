[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reliefroute-contracts"
version = "0.1.0"
description = "Frozen shared contracts (enums, event payloads, stream names) for ReliefRoute"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["reliefroute_contracts*"]
