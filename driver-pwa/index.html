<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b7285"><link rel="manifest" href="/driver/manifest.webmanifest">
<title>ReliefRoute Driver</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;color:#1d2329} header{background:#0b7285;color:#fff;padding:12px 16px}
 main{padding:12px 16px;max-width:560px;margin:0 auto} h1{font-size:18px;margin:0} h2{font-size:15px;margin:18px 0 6px}
 label{display:block;margin:8px 0 2px;font-size:14px} input,select,button{font-size:16px;padding:9px;width:100%;box-sizing:border-box}
 button{margin-top:8px;background:#0b7285;color:#fff;border:0;border-radius:6px} button.secondary{background:#495057}
 .stat{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid #eee}
 .drill{background:#6f2dbd;color:#fff;font-weight:800;padding:4px 8px;border-radius:4px;display:inline-block}
 .instr{white-space:pre-wrap;background:#f1f3f5;padding:10px;border-radius:6px;font-size:16px;line-height:1.5}
 .err{background:#fff0f0;padding:8px;border-radius:6px} .ok{color:#2f9e44} .bad{color:#c92a2a}
 ol li{margin-bottom:6px} ol li.done{color:#868e96;text-decoration:line-through}
 .newroute{background:#e8590c;color:#fff;font-weight:700;padding:10px;border-radius:6px;margin:8px 0}
</style></head><body>
<header><h1>ReliefRoute Driver</h1></header>
<main>
 <section id="register" hidden>
  <h2>Register this vehicle</h2>
  <label>Vehicle number<input id="label" maxlength="100" placeholder="AP 16 TX 1234"></label>
  <label>Your name<input id="name" maxlength="100"></label>
  <label>Phone (E.164)<input id="phone" inputmode="tel" placeholder="+9198xxxxxxxx"></label>
  <label>Language<select id="lang"><option value="te">తెలుగు (Telugu)</option><option value="hi">हिन्दी (Hindi)</option><option value="en">English</option></select></label>
  <label>Load capacity (kg)<input id="cap" type="number" min="1" inputmode="numeric"></label>
  <label>Enrolment code (from your dispatcher)<input id="code" autocomplete="off"></label>
  <button id="do-register">Register</button>
  <div id="reg-msg"></div>
 </section>
 <section id="driving" hidden>
  <div class="stat"><span>Vehicle</span><b id="v-label"></b></div>
  <div class="stat"><span>GPS</span><span id="gps">waiting…</span></div>
  <div class="stat"><span>Network</span><span id="net"></span></div>
  <div class="stat"><span>Queued fixes</span><span id="queued">0</span></div>
  <div class="stat"><span>Last upload</span><span id="sent">never</span></div>
  <h2>Assignment</h2>
  <div id="assignment"><p>No assignment yet. Keep this screen open; it refreshes automatically.</p></div>
  <button id="speak" class="secondary" hidden>🔊 Read instructions aloud</button>
  <button id="forget" class="secondary">Sign out this device</button>
 </section>
</main>
<script src="/driver/queue.js"></script>
<script src="/driver/app.js"></script>
</body></html>
